name: Auto Retraining

on:
  workflow_dispatch:  # Déclenché manuellement ou par monitor
  schedule:
    - cron: '0 0 * * 0'  # Tous les dimanches

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install dvc mlflow
    
    - name: Pull latest data with DVC
      run: |
        dvc pull
    
    - name: Retrain model
      run: |
        python src/train_simple.py
    
    - name: Evaluate new model
      run: |
        python src/evaluate.py --threshold 0.80
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: new-model
        path: |
          model.h5
          model_weights.h5
          model.pkl
    
    - name: Commit and push new model
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add model.h5 model_weights.h5 model.pkl
        git commit -m "Auto-retraining: model updated on $(date +'%Y-%m-%d')" || echo "No changes"
        git push
    
    - name: Push to DVC remote
      run: |
        dvc add model.h5
        dvc push
    
    - name: Log with MLflow
      env:
        MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      run: |
        mlflow run . --experiment-name "Auto-retraining"
    
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: model-v${{ github.run_number }}
        name: Model Release v${{ github.run_number }}
        files: |
          model.h5
          model_weights.h5
