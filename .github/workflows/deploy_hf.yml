name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Cloner l'espace
          git clone https://lepiso:$HF_TOKEN@huggingface.co/spaces/lepiso/cifar10-MLops
          cd cifar10-MLops
          
          # Copier les fichiers
          cp -r ../streamlit_app . 2>/dev/null || echo "streamlit_app not found"
          cp ../model.h5 . 2>/dev/null || echo "model.h5 not found"
          cp ../params.yaml . 2>/dev/null || echo "params.yaml not found"
          cp ../requirements-streamlit.txt requirements.txt 2>/dev/null || cp ../requirements.txt requirements.txt
          
          # Créer Dockerfile
          cat > Dockerfile << 'DOCKEREOF'
          FROM python:3.12-slim

          ENV PYTHONDONTWRITEBYTECODE=1
          ENV PYTHONUNBUFFERED=1

          WORKDIR /app

          RUN apt-get update && apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            curl \
            && rm -rf /var/lib/apt/lists/*

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY streamlit_app/ ./streamlit_app/
          COPY model.h5 .
          COPY params.yaml .

          EXPOSE 7860

          CMD ["streamlit", "run", "streamlit_app/app.py", "--server.port=7860", "--server.address=0.0.0.0"]
          DOCKEREOF
          
          # Créer README
          cat > README.md << 'README'
          ---
          title: CIFAR-10 Image Classifier
          emoji: 🖼️
          colorFrom: blue
          colorTo: purple
          sdk: docker
          pinned: false
          ---

          # 🖼️ CIFAR-10 Image Classifier
          README
          
          # Pousser
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy from GitHub Actions" || echo "No changes"
          git push
