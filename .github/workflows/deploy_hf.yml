name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Cloner l'espace
          git clone https://lepiso:$HF_TOKEN@huggingface.co/spaces/lepiso/cifar10-MLops
          cd cifar10-MLops
          
          # Copier les fichiers (incluant Dockerfile)
          cp -r ../streamlit_app . 2>/dev/null || echo "streamlit_app not found"
          cp ../model.h5 . 2>/dev/null || echo "model.h5 not found"
          cp ../params.yaml . 2>/dev/null || echo "params.yaml not found"
          cp ../requirements-streamlit.txt requirements.txt 2>/dev/null || cp ../requirements.txt requirements.txt
          cp ../Dockerfile . 2>/dev/null || echo "Dockerfile not found"
          
          # Créer README
          cat > README.md << 'README'
          ---
          title: CIFAR-10 Image Classifier
          emoji: 🖼️
          colorFrom: blue
          colorTo: purple
          sdk: docker
          pinned: false
          ---

          # 🖼️ CIFAR-10 Image Classifier
            README
          
          # Pousser
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy from GitHub Actions" || echo "No changes"
          git push
